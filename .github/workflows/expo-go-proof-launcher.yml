name: Expo Go Proof Launcher

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/expo-go-proof-launcher.yml'
  workflow_dispatch:

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expo-go-webview-proof
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Install test dependencies
        working-directory: expo-go-test
        run: npm install
      - name: Start Expo Go tunnel
        working-directory: expo-go-test
        run: |
          echo 'Starting temporary Expo Go tunnel for physical-device WebView proof...'
          timeout 1200 npx expo start --tunnel --clear
