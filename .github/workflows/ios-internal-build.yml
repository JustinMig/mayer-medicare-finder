name: iOS Internal Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-internal-build.yml'
      - 'native-app/**'

jobs:
  build-ios:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Install dependencies
        run: npm install
      - name: Verify Expo authentication
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN_MISSING"
            echo "Add an Expo personal access token as the repository secret EXPO_TOKEN."
            exit 1
          fi
          npx eas-cli@latest whoami
      - name: Link or initialize EAS project
        run: npx eas-cli@latest init --non-interactive --force
      - name: Start iOS internal distribution build
        run: npx eas-cli@latest build --platform ios --profile preview --non-interactive --no-wait
