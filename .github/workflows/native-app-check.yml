name: Native app check

on:
  push:
    paths:
      - 'native-app/**'
      - '.github/workflows/native-app-check.yml'
  pull_request:
    paths:
      - 'native-app/**'
      - '.github/workflows/native-app-check.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: native-app/package-lock.json
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo-doctor
