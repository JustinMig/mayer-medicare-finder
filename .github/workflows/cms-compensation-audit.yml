name: CMS Compensation Audit
on:
  push:
    paths: ['.github/workflows/cms-compensation-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Download CMS data
        run: |
          curl -fL --retry 3 -A 'Mozilla/5.0' 'https://www.cms.gov/files/zip/cy-2026-agent-broker-compensation-data.zip' -o /tmp/c.zip
          mkdir /tmp/c && unzip -oq /tmp/c.zip -d /tmp/c
          python -m pip install --quiet pandas openpyxl xlrd
      - name: Classify plans
        run: |
          python - <<'PY'
          import glob,os,pandas as pd
          raw='''H3239 005 0\nH3239 012 0\nH3239 014 0\nH3239 015 0\nH3239 017 0\nH3239 028 0\nH5521 218 0\nH5521 464 0\nH5521 465 0\nH5521 470 0\nH5521 477 0\nH5521 553 0\nH7355 001 0\nH7355 002 0\nH7355 003 0\nH7355 004 0\nH7355 006 0\nH7355 007 0\nH7355 009 0\nH7355 010 0\nH4407 004 0\nH4407 027 0\nH4407 029 0\nH4407 030 1\nH4407 030 2\nH4407 030 3\nH4407 034 0\nH4513 049 4\nH7849 135 0\nH7849 144 0\nH7849 153 0\nH1036 151 0\nH1036 222 0\nH1036 327 0\nH1036 328 0\nH1036 329 0\nH1036 330 0\nH5216 097 0\nH5216 136 0\nH5216 160 0\nH5216 292 0\nH5216 298 0\nH5216 300 0\nH5216 334 0\nH5216 367 0\nH6622 047 0\nH6622 048 0\nH7617 082 0\nH7617 083 0\nH7617 084 0\nH7617 085 0\nH7617 087 0\nR0110 003 0\nH0710 004 0\nH1889 011 0\nH1889 032 0\nH5008 011 0\nH5008 016 0\nH5008 017 0\nH5253 141 0\nH5253 183 0\nH8768 030 0\nH8768 034 0\nH8768 040 0'''
          wanted=[tuple(x.split()) for x in raw.splitlines()]
          frames=[]
          for p in glob.glob('/tmp/c/**/*',recursive=True):
            if not os.path.isfile(p): continue
            try:
              if p.lower().endswith('.xlsx'): d=pd.read_excel(p,dtype=str,keep_default_na=False)
              elif p.lower().endswith('.xls'): d=pd.read_excel(p,dtype=str,keep_default_na=False)
              elif p.lower().endswith('.csv'): d=pd.read_csv(p,dtype=str,keep_default_na=False)
              else: continue
              frames.append(d)
            except: pass
          d=pd.concat(frames,ignore_index=True).fillna('')
          def n(v):
            try:return str(int(float(str(v).strip())))
            except:return str(v).strip()
          out=[]
          for c,p,s in wanted:
            m=d[(d['State Code'].astype(str).str.upper()=='MS') & (d['Contract ID'].astype(str).str.upper()==c) & (d['Plan ID'].map(n)==str(int(p))) & (d['Segment ID'].map(n)==str(int(s)))]
            if m.empty:
              status='UNMATCHED'; indep=''; high=''
            else:
              indep='Y' if (m['Used Independent Agents?'].astype(str).str.upper()=='Y').any() else 'N'
              vals=pd.to_numeric(m['Initial Compensation High'],errors='coerce').fillna(0)
              high=str(float(vals.max()))
              status='COMMISSIONABLE' if indep=='Y' and vals.max()>0 else 'NON_COMMISSIONABLE'
            out.append((c,p,s,status,indep,high))
          lines=['# CMS 2026 exact plan compensation classification','', '| Contract | Plan | Segment | Status | Independent agents | Initial comp high |','|---|---:|---:|---|---|---:|']
          for r in out: lines.append('| '+' | '.join(r)+' |')
          lines += ['',f'Commissionable: {sum(r[3]=="COMMISSIONABLE" for r in out)}',f'Non-commissionable: {sum(r[3]=="NON_COMMISSIONABLE" for r in out)}',f'Unmatched: {sum(r[3]=="UNMATCHED" for r in out)}']
          open('/tmp/report.md','w').write('\n'.join(lines))
          PY
      - name: Publish classification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "CMS 2026 Exact Compensation Classification" --body-file /tmp/report.md
